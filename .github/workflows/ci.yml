name: CI

# Pull requests only. A merge to main repeats work the pull request checks
# already did, so it earns no new signal; the release workflow verifies the
# tagged commit before anything is published. Dispatch exists so main can still
# be checked on demand from the Actions tab.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # The data file lock is OS-specific: flock(2) on Linux, LockFileEx on
    # Windows. The release pipeline builds for both, so the suite runs on both
    # rather than trusting that a POSIX-only run covers the Windows path.
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the other's result.
      fail-fast: false
      matrix:
        include:
          # The race detector needs a C toolchain. Linux has one in the image;
          # Windows has MinGW but its go test -race setup is unreliable, so the
          # store's cross-process tests (which are what the lock needs) run
          # there without it.
          - os: ubuntu-latest
            race: true
          - os: windows-latest
            race: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        # The default shell on Windows runners is PowerShell, which would not
        # handle the loop below.
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      # -count=1 defeats the test result cache, so a green run means the tests
      # actually executed here rather than being replayed from a previous job.
      - name: Test with race detector
        if: matrix.race
        run: go test -race -count=1 ./...

      - name: Test
        if: matrix.race == false
        run: go test -count=1 ./...

      - name: Build
        run: go build ./...
