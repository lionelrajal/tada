# Release pipeline configuration. See RELEASING.md for the policy this enforces.
#
# Owner and repository are intentionally not hardcoded: GoReleaser derives them
# from GITHUB_REPOSITORY, so this file keeps working wherever the repo is pushed.
version: 2

project_name: tada

builds:
  - id: tada
    main: ./cmd/tada
    binary: tada
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/lionelrajal/tada/cmd.version={{ .Version }}
      - -X github.com/lionelrajal/tada/cmd.commit={{ .Commit }}
      - -X github.com/lionelrajal/tada/cmd.date={{ .CommitDate }}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Bug fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Other changes
      order: 999
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^chore(\(.+\))?:'
      - '^ci(\(.+\))?:'
      - '^style(\(.+\))?:'
      - '^Merge pull request'
      - '^Merge branch'

release:
  draft: false
  # Tags like v0.2.0-rc.1 are published as prereleases automatically.
  prerelease: auto
  name_template: "v{{ .Version }}"
  footer: |
    **Full changelog**: {{ .Env.GITHUB_SERVER_URL }}/{{ .Env.GITHUB_REPOSITORY }}/compare/{{ .PreviousTag }}...{{ .Tag }}

snapshot:
  version_template: "{{ incpatch .Version }}-next"
